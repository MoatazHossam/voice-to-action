name: voice_to_action
description: "Standalone Flutter POC for a portable AI Intake control (ai_intake module) with a demo action-preview shell."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management, DI, and routing for the whole demo shell and the
  # ai_intake feature module (binding/controller/page per module).
  get: ^4.6.6

  # Real on-device audio recording (idle -> permission -> recording state).
  # NOTE: audio_waveforms' PlayerController must not be used as a recorder;
  # it is a playback/visualization library only (see README_AI_INTAKE.md).
  record: ^6.1.1

  # Real local playback of a just-recorded clip (independent of the old
  # chat AudioPlayerController; no remote download, no ChatPostModel).
  audioplayers: ^6.1.1

  # Real camera/gallery capture for the image entry flow.
  image_picker: ^1.1.2

  # Explicit mic/camera permission state before invoking capture.
  permission_handler: ^11.3.1

  # Local, on-device temp storage for recorded clips and picked images.
  path_provider: ^2.1.4

  # On-device multilingual Whisper ASR runtime (no cloud calls). See
  # ARCHITECTURE.md "On-device Arabic speech-to-text" for model source,
  # license, and size. The model files are NOT bundled in this repo; the app
  # downloads, verifies, and installs them itself on first use — see
  # WhisperModelProvisioner — so no manual/developer step is needed.
  sherpa_onnx: ^1.13.8

  # Transport for the one-time, in-app Arabic model download (per
  # README_AI_INTAKE.md: "use http, not Dio").
  http: ^1.2.2

  # SHA-256 verification of downloaded model files before they're trusted.
  crypto: ^3.0.5

  # On-device Arabic OCR: Tesseract 4 (LSTM) via native Tesseract4Android /
  # SwiftyTesseract. See ARCHITECTURE.md "On-device Arabic OCR" for why
  # Google ML Kit was ruled out (no Arabic script support) and full model
  # provenance/license/size. Trained-data files are NOT bundled in this repo;
  # TesseractModelProvisioner downloads, verifies, and installs them itself.
  #
  # Pinned to a git commit, not the pub.dev release (0.4.31): the published
  # version's android/build.gradle still calls the defunct jcenter() and
  # fails to build with current Gradle/AGP. That fix landed on the package's
  # GitHub master after the last pub.dev publish — this pins the exact
  # commit that has it, for a reproducible fresh-install build (verified in
  # this milestone; see ARCHITECTURE.md).
  flutter_tesseract_ocr:
    git:
      url: https://github.com/khjde1207/tesseract_ocr.git
      ref: 259994d4d93d755f8d365907df0f3b174f85ff57

  # Pure-Dart image decode/EXIF-orientation-correction/resize before OCR —
  # no native dependency, no platform channel.
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # flutter_tesseract_ocr always reads this tiny config (just the list of
  # trained-data filenames) from the asset bundle, regardless of where the
  # actual trained-data files come from. It is NOT the trained-data itself —
  # those are downloaded/verified/installed at runtime by
  # TesseractModelProvisioner, never bundled here (see ARCHITECTURE.md).
  assets:
    - assets/tessdata_config.json
